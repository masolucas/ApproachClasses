<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Present Simple Slots</title>
<style>
:root{
  --navy:#0f2340;
  --navy-2:#173156;
  --navy-3:#21406c;
  --gold:#c9a24b;
  --gold-deep:#a8832f;
  --gold-soft:#ead7a6;
  --cream:#faf6ee;
  --paper:#fffdf8;
  --page-bg:var(--cream);
  --page-text:var(--navy);
  --muted:#5a6a82;
  --panel-bg:var(--paper);
  --panel-text:var(--navy);
  --panel-line:#e4dccb;
  --reel-h:clamp(104px,17vh,190px);
  --display:Cambria,"Cambria Math",Georgia,"Times New Roman",serif;
  --body:Calibri,Carlito,"Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page-bg:#081629;
    --page-text:var(--cream);
    --muted:#a9b6c9;
    --panel-bg:#122a4b;
    --panel-text:var(--cream);
    --panel-line:#26446f;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page-bg:#081629;
  --page-text:var(--cream);
  --muted:#a9b6c9;
  --panel-bg:#122a4b;
  --panel-text:var(--cream);
  --panel-line:#26446f;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  background:var(--page-bg);
  color:var(--page-text);
  font-family:var(--body);
  font-size:18px;
  line-height:1.5;
}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

.wrap{max-width:1180px;margin:0 auto;padding:clamp(14px,3vw,32px)}

/* Header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:clamp(14px,2.5vh,26px)}
.top h1{
  font-family:var(--display);
  font-weight:700;
  font-size:clamp(2rem,4.6vw,3.4rem);
  line-height:1;
  margin:0;
  letter-spacing:-.01em;
}
.top p{margin:.35em 0 0;color:var(--muted);font-size:1.05rem}
.ghost{
  background:transparent;
  border:1.5px solid var(--gold);
  color:var(--page-text);
  border-radius:999px;
  padding:.4em 1.1em;
  font-size:.95rem;
  white-space:nowrap;
}
.ghost:hover{background:color-mix(in srgb,var(--gold) 18%,transparent)}

/* Cabinet */
.stage{position:relative;padding-right:clamp(0px,5vw,64px)}
.cabinet{
  position:relative;
  background:
    radial-gradient(120% 90% at 50% 0%,var(--navy-3) 0%,var(--navy-2) 45%,var(--navy) 100%);
  border-radius:28px;
  padding:clamp(18px,3vw,38px) clamp(14px,2.6vw,34px) clamp(20px,3vw,34px);
  color:var(--cream);
  box-shadow:0 0 0 2px var(--gold-deep) inset, 0 18px 40px -18px rgba(8,22,41,.6);
}
.corner{position:absolute;width:30px;height:30px;border:3px solid var(--gold);pointer-events:none}
.corner.tl{top:12px;left:12px;border-right:0;border-bottom:0;border-top-left-radius:10px}
.corner.tr{top:12px;right:12px;border-left:0;border-bottom:0;border-top-right-radius:10px}
.corner.bl{bottom:12px;left:12px;border-right:0;border-top:0;border-bottom-left-radius:10px}
.corner.br{bottom:12px;right:12px;border-left:0;border-top:0;border-bottom-right-radius:10px}

.reels{
  display:grid;
  grid-template-columns:1fr 1.15fr 1fr 1.35fr;
  gap:clamp(8px,1.4vw,16px);
  background:#0a1a31;
  border-radius:18px;
  padding:clamp(8px,1.2vw,14px);
  box-shadow:inset 0 2px 10px rgba(0,0,0,.5);
}
.reel{display:flex;flex-direction:column;gap:10px;min-width:0}
.window{
  position:relative;
  height:var(--reel-h);
  overflow:hidden;
  background:var(--cream);
  color:var(--navy);
  border-radius:10px;
  box-shadow:inset 0 0 0 2px transparent;
  transition:box-shadow .2s;
}
.window::before,.window::after{
  content:"";position:absolute;left:0;right:0;height:22%;z-index:2;pointer-events:none;
}
.window::before{top:0;background:linear-gradient(rgba(15,35,64,.28),rgba(15,35,64,0))}
.window::after{bottom:0;background:linear-gradient(rgba(15,35,64,0),rgba(15,35,64,.28))}
.window.held{box-shadow:inset 0 0 0 4px var(--gold)}
.window.landed{animation:land .45s ease-out}
@keyframes land{0%{box-shadow:inset 0 0 0 4px var(--gold-soft)}100%{box-shadow:inset 0 0 0 2px transparent}}
.window.held.landed{animation:none}
.strip{will-change:transform}
.item{
  height:var(--reel-h);
  display:flex;align-items:center;justify-content:center;
  padding:0 .5em;
  text-align:center;
  font-family:var(--display);
  font-weight:700;
  font-size:clamp(1.25rem,2.9vw,2.6rem);
  line-height:1.05;
  text-wrap:balance;
}
.item.comp{font-size:clamp(1rem,2.1vw,1.85rem);font-weight:400;font-style:italic}
.item.blank{color:#b8ad95}
.item.type{flex-direction:column;gap:.15em}
.item.type .sym{
  display:grid;place-items:center;
  width:1.35em;height:1.35em;border-radius:50%;
  background:var(--navy);color:var(--gold);
  font-size:1.05em;line-height:1;
}
.item.type .lbl{font-size:.62em;font-family:var(--body);font-weight:700}

.reel-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:38px;padding:0 2px}
.reel-name{font-size:.95rem;color:var(--gold-soft)}
.hold{
  background:transparent;color:var(--cream);
  border:1.5px solid color-mix(in srgb,var(--gold) 70%,transparent);
  border-radius:8px;padding:.18em .75em;font-size:.88rem;
}
.hold[aria-pressed="true"]{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}
.hold:disabled{opacity:.35;cursor:default}
.follows{font-size:.85rem;color:#8fa2bf;font-style:italic}

.controls{display:flex;justify-content:center;align-items:center;gap:clamp(10px,2vw,22px);margin-top:clamp(16px,2.6vh,26px);flex-wrap:wrap}
.spin{
  background:linear-gradient(var(--gold-soft),var(--gold) 55%,var(--gold-deep));
  color:var(--navy);
  border:0;border-radius:999px;
  padding:.45em 2.2em;
  font-family:var(--display);font-weight:700;
  font-size:clamp(1.4rem,2.6vw,2rem);
  box-shadow:0 5px 0 #7d6020,0 10px 18px -8px rgba(0,0,0,.6);
  transition:transform .08s,box-shadow .08s;
}
.spin:active{transform:translateY(4px);box-shadow:0 1px 0 #7d6020}
.spin:disabled{filter:saturate(.5) brightness(.85);cursor:default}
.reveal{
  background:transparent;color:var(--cream);
  border:2px solid var(--gold);border-radius:999px;
  padding:.45em 1.8em;
  font-family:var(--display);font-weight:700;
  font-size:clamp(1.2rem,2.2vw,1.6rem);
}
.reveal:hover:not(:disabled){background:color-mix(in srgb,var(--gold) 20%,transparent)}
.reveal:disabled{opacity:.4;cursor:default}
.notice{width:100%;text-align:center;color:var(--gold-soft);min-height:1.5em;margin:4px 0 0;font-size:.95rem}

/* Lever */
.lever{
  position:absolute;right:0;top:18%;
  width:clamp(36px,4vw,52px);height:62%;
  background:none;border:0;padding:0;
}
.lever .base{position:absolute;left:0;bottom:0;width:70%;height:22%;background:var(--navy);border:2px solid var(--gold-deep);border-radius:8px}
.lever .arm{
  position:absolute;left:28%;bottom:16%;width:14%;height:80%;
  background:linear-gradient(90deg,#9aa3b1,#e9edf2,#9aa3b1);border-radius:6px;
  transform-origin:50% 100%;transition:transform .25s cubic-bezier(.3,.7,.3,1.3);
}
.lever .knob{
  position:absolute;left:50%;top:-14%;transform:translateX(-50%);
  width:clamp(28px,3.4vw,42px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff2c9,var(--gold) 45%,var(--gold-deep));
  box-shadow:0 3px 6px rgba(0,0,0,.35);
}
.lever.pulled .arm{transform:scaleY(-.55)}

/* Answer */
.answer{
  margin-top:clamp(16px,2.6vh,26px);
  background:var(--panel-bg);color:var(--panel-text);
  border:1px solid var(--panel-line);
  border-left:6px solid var(--gold);
  border-radius:16px;
  padding:clamp(16px,2.4vw,28px) clamp(18px,3vw,36px);
  min-height:120px;
}
.answer .hint{margin:0;color:var(--muted);font-size:1.1rem}
.sentence{
  font-family:var(--display);
  font-size:clamp(1.6rem,3.6vw,3rem);
  line-height:1.2;
  margin:0;
}
.sentence mark{
  background:var(--gold);color:var(--navy);
  padding:0 .18em;border-radius:6px;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
}
.sentence mark u{text-decoration-thickness:3px;text-underline-offset:4px}
.short{margin:.5em 0 0;font-size:clamp(1.05rem,1.8vw,1.4rem);color:var(--muted)}
.short b{color:var(--panel-text)}
.rules{list-style:none;padding:0;margin:1em 0 0;display:flex;flex-wrap:wrap;gap:8px 10px}
.rules li{
  border:1px solid var(--panel-line);
  border-radius:10px;
  padding:.35em .8em;
  font-size:clamp(.95rem,1.4vw,1.15rem);
}
.rules li b{color:var(--gold-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rules li b{color:var(--gold)}}
:root[data-theme="dark"] .rules li b{color:var(--gold)}
.rules li.warn{border-color:var(--gold)}
.answer.shown .sentence{animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Settings */
.settings{margin-top:18px;border-top:1px solid var(--panel-line);padding-top:12px}
.settings summary{cursor:pointer;font-weight:700;width:max-content}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px 28px;margin-top:12px}
.settings fieldset{border:0;margin:0;padding:0}
.settings legend{font-family:var(--display);font-weight:700;font-size:1.1rem;margin-bottom:4px}
.settings label{display:flex;align-items:center;gap:.5em;padding:.15em 0}
.settings input{width:1.1em;height:1.1em;accent-color:var(--gold-deep)}
.settings .sub{color:var(--muted);font-size:.88rem}
.keys{margin:16px 0 0;color:var(--muted);font-size:.95rem}
kbd{font-family:var(--body);border:1px solid var(--panel-line);border-bottom-width:2px;border-radius:5px;padding:0 .4em;background:var(--panel-bg)}

@media (max-width:820px){
  .stage{padding-right:0}
  .lever{display:none}
  .reels{grid-template-columns:1fr 1fr}
  :root{--reel-h:clamp(88px,14vh,130px)}
  .item{font-size:clamp(1.15rem,5vw,1.7rem)}
  .item.comp{font-size:clamp(.95rem,4vw,1.25rem)}
  .top{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){
  .window.landed,.answer.shown .sentence{animation:none}
  .lever .arm{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Present Simple Slots</h1>
      <p>Spin the reels, say the sentence, then reveal the answer.</p>
    </div>
    <button class="ghost" id="fullscreen" type="button">Full screen</button>
  </header>

  <div class="stage">
    <section class="cabinet" aria-label="Slot machine">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="reels">
        <div class="reel">
          <div class="window" id="win-type"><div class="strip"></div></div>
          <div class="reel-foot"><span class="reel-name">Sentence</span><button class="hold" data-reel="type" aria-pressed="false" disabled>Hold</button></div>
        </div>
        <div class="reel">
          <div class="window" id="win-subj"><div class="strip"></div></div>
          <div class="reel-foot"><span class="reel-name">Subject</span><button class="hold" data-reel="subj" aria-pressed="false" disabled>Hold</button></div>
        </div>
        <div class="reel">
          <div class="window" id="win-verb"><div class="strip"></div></div>
          <div class="reel-foot"><span class="reel-name">Verb</span><button class="hold" data-reel="verb" aria-pressed="false" disabled>Hold</button></div>
        </div>
        <div class="reel">
          <div class="window" id="win-comp"><div class="strip"></div></div>
          <div class="reel-foot"><span class="reel-name">Complement</span><span class="follows">Matches the verb</span></div>
        </div>
      </div>
      <div class="controls">
        <button class="spin" id="spin" type="button">Spin</button>
        <button class="reveal" id="reveal" type="button" disabled>Reveal</button>
        <p class="notice" id="notice" aria-live="polite"></p>
      </div>
    </section>
    <button class="lever" id="lever" type="button" aria-label="Pull the lever to spin" tabindex="-1">
      <span class="base"></span><span class="arm"><span class="knob"></span></span>
    </button>
  </div>

  <section class="answer" id="answer" aria-live="polite">
    <p class="hint">Press Spin to start.</p>
  </section>

  <details class="settings" id="settings">
    <summary>Settings</summary>
    <div class="settings-grid">
      <fieldset data-group="types">
        <legend>Sentence types</legend>
        <label><input type="checkbox" value="A" checked> Affirmative</label>
        <label><input type="checkbox" value="N" checked> Negative</label>
        <label><input type="checkbox" value="Q" checked> Question</label>
      </fieldset>
      <fieldset data-group="groups">
        <legend>Verb groups</legend>
        <label><input type="checkbox" value="s" checked> +s <span class="sub">work, play</span></label>
        <label><input type="checkbox" value="es" checked> +es <span class="sub">watch, go</span></label>
        <label><input type="checkbox" value="ies" checked> y → ies <span class="sub">study</span></label>
        <label><input type="checkbox" value="irr" checked> Irregular <span class="sub">have</span></label>
      </fieldset>
      <fieldset data-group="sets">
        <legend>Subjects</legend>
        <label><input type="checkbox" value="pro" checked> Pronouns <span class="sub">I, you, he…</span></label>
        <label><input type="checkbox" value="name" checked> Names <span class="sub">Maria, Kenji…</span></label>
        <label><input type="checkbox" value="people" checked> People <span class="sub">my parents…</span></label>
        <label><input type="checkbox" value="other" checked> Animals and things <span class="sub">my cat, the bus…</span></label>
      </fieldset>
      <fieldset data-group="extras">
        <legend>Answer extras</legend>
        <label><input type="checkbox" id="opt-pron" checked> Show -s pronunciation</label>
        <label><input type="checkbox" id="opt-short" checked> Show short answers</label>
      </fieldset>
    </div>
    <p class="keys"><kbd>Space</kbd> spins, <kbd>R</kbd> reveals, and <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> hold the first three reels.</p>
  </details>
</div>

<script>
/* ---------- Data ---------- */
const SUBJECTS = [
  // pronouns
  {t:'I',     set:'pro', pro:'I',    third:false, ans:'you',  k:'p'},
  {t:'you',   set:'pro', pro:'you',  third:false, ans:'I',    k:'p'},
  {t:'he',    set:'pro', pro:'he',   third:true,  ans:'he',   k:'p'},
  {t:'she',   set:'pro', pro:'she',  third:true,  ans:'she',  k:'p'},
  {t:'we',    set:'pro', pro:'we',   third:false, ans:'we',   k:'p'},
  {t:'they',  set:'pro', pro:'they', third:false, ans:'they', k:'p'},
  // names
  {t:'Maria',        set:'name', pro:'she',  third:true,  ans:'she',  k:'p'},
  {t:'Kenji',        set:'name', pro:'he',   third:true,  ans:'he',   k:'p'},
  {t:'Ahmed',        set:'name', pro:'he',   third:true,  ans:'he',   k:'p'},
  {t:'Sofia',        set:'name', pro:'she',  third:true,  ans:'she',  k:'p'},
  {t:'Carlos',       set:'name', pro:'he',   third:true,  ans:'he',   k:'p'},
  {t:'Yuki',         set:'name', pro:'she',  third:true,  ans:'she',  k:'p'},
  {t:'Tom and Lucy', set:'name', pro:'they', third:false, ans:'they', k:'p'},
  // people
  {t:'my mom',          set:'people', pro:'she',  third:true,  ans:'she',  k:'p'},
  {t:'my dad',          set:'people', pro:'he',   third:true,  ans:'he',   k:'p'},
  {t:'my parents',      set:'people', pro:'they', third:false, ans:'they', k:'p'},
  {t:'your boyfriend',  set:'people', pro:'he',   third:true,  ans:'he',   k:'p'},
  {t:'your girlfriend', set:'people', pro:'she',  third:true,  ans:'she',  k:'p'},
  {t:'your friends',    set:'people', pro:'they', third:false, ans:'they', k:'p'},
  {t:'my sister',       set:'people', pro:'she',  third:true,  ans:'she',  k:'p'},
  {t:'his brothers',    set:'people', pro:'they', third:false, ans:'they', k:'p'},
  {t:'my grandma',      set:'people', pro:'she',  third:true,  ans:'she',  k:'p'},
  {t:'her husband',     set:'people', pro:'he',   third:true,  ans:'he',   k:'p'},
  {t:'my neighbors',    set:'people', pro:'they', third:false, ans:'they', k:'p'},
  {t:'the students',    set:'people', pro:'they', third:false, ans:'they', k:'p'},
  // animals and things
  {t:'my cat',    set:'other', pro:'it',   third:true,  ans:'it',   k:'a'},
  {t:'our dog',   set:'other', pro:'it',   third:true,  ans:'it',   k:'a'},
  {t:'my cats',   set:'other', pro:'they', third:false, ans:'they', k:'a'},
  {t:'the bus',   set:'other', pro:'it',   third:true,  ans:'it',   k:'bus'},
  {t:'the store', set:'other', pro:'it',   third:true,  ans:'it',   k:'store'},
  {t:'the class', set:'other', pro:'it',   third:true,  ans:'it',   k:'class'}
];

// b: base, s: he/she/it form, g: group, p: sound of the ending, k: subject kinds, c: complements
function V(b,s,g,p,k,c){return {b,s,g,p,k:k.split(','),c};}
const VERBS = [
  // +s
  V('work','works','s','s','p',['at a hospital','from home','on Saturdays','in an office']),
  V('get up','gets up','s','s','p',['early','at 7 o’clock','late on Sundays']),
  V('wake up','wakes up','s','s','p,a',['at 6:30','early','late on weekends']),
  V('take','takes','s','s','p',['the bus to school','a shower every morning','a lot of photos']),
  V('help','helps','s','s','p',['at home','with the dishes','new students']),
  V('eat','eats','s','s','p,a',{p:['breakfast at 8','rice every day','pizza on Fridays'],a:['fish','twice a day','a lot']}),
  V('drink','drinks','s','s','p,a',{p:['coffee in the morning','a lot of water','tea after dinner'],a:['a lot of water','milk']}),
  V('cook','cooks','s','s','p',['dinner every night','Italian food','on weekends']),
  V('live','lives','s','z','p',['in Boston','near the school','with roommates']),
  V('walk','walks','s','s','p,a',{p:['to work','to school','in the park every evening'],a:['in the park','every morning']}),
  V('drive','drives','s','z','p',['to work','a red car','very fast']),
  V('call','calls','s','z','p',['home every Sunday','the doctor','friends at night']),
  V('make','makes','s','s','p',['breakfast','the bed every morning','a lot of mistakes']),
  V('listen','listens','s','z','p',['to music','to the radio in the car','to podcasts']),
  V('paint','paints','s','s','p',['pictures','on weekends','the house every summer']),
  V('sell','sells','s','z','p,store',{p:['cars','clothes online','fruit at the market'],store:['shoes','fresh bread','phones']}),
  V('answer','answers','s','z','p',['the phone','emails at work','questions in class']),
  V('say','says','s','z','p',['hello to everyone','thank you','good morning']),
  V('play','plays','s','z','p,a',{p:['soccer','the guitar','video games'],a:['in the garden','with a ball']}),
  V('arrive','arrives','s','z','p,bus',{p:['late','on time','at 9 o’clock'],bus:['at 8:15','late','on time']}),
  V('hug','hugs','s','z','p',['everyone at parties','the kids','friends a lot']),
  V('run','runs','s','z','p,a',{p:['in the park','every morning','5 kilometers'],a:['in the garden','very fast']}),
  V('laugh','laughs','s','s','p',['a lot','at bad jokes','in class']),
  V('read','reads','s','z','p',['the news','books before bed','comics']),
  V('write','writes','s','s','p',['emails','in English','stories']),
  V('sleep','sleeps','s','s','p,a',{p:['8 hours','late on Sundays','on the sofa'],a:['on the sofa','all day']}),
  V('open','opens','s','z','p,store',{p:['the window','the door for people'],store:['at 9 a.m.','on Sundays','early']}),
  V('close','closes','s','iz','p,store',{p:['the door','the windows at night'],store:['at 10 p.m.','early on Sundays','on holidays']}),
  V('start','starts','s','s','p,class,bus',{p:['work at 8','school in September'],class:['at 9 o’clock','on Mondays'],bus:['at 6 a.m.']}),
  V('like','likes','s','s','p,a',{p:['chocolate','rock music','rainy days'],a:['fish','the sun']}),
  V('want','wants','s','s','p',['a new phone','a pet','coffee']),
  V('need','needs','s','z','p',['help with homework','a new laptop','more sleep']),
  V('love','loves','s','z','p,a',{p:['pizza','the beach','old movies'],a:['the garden','milk']}),
  V('buy','buys','s','z','p',['groceries on Saturdays','clothes online','coffee every morning']),
  V('pay','pays','s','z','p',['the bills','by card','rent every month']),
  V('stay','stays','s','z','p,a',{p:['home on Sundays','at a hotel','up late'],a:['inside when it rains','home all day']}),
  V('enjoy','enjoys','s','z','p',['cooking','the weekend','long walks']),
  // +es
  V('watch','watches','es','iz','p',['TV every night','movies on Fridays','soccer']),
  V('catch','catches','es','iz','p,a',{p:['the bus at 8','a cold every winter','the train'],a:['mice','the ball']}),
  V('teach','teaches','es','iz','p',['English','math at a high school','yoga']),
  V('wash','washes','es','iz','p',['the dishes','the car on Sundays','clothes on Mondays']),
  V('finish','finishes','es','iz','p,class',{p:['work at 5','homework early'],class:['at noon','at 3 p.m.']}),
  V('fix','fixes','es','iz','p',['cars','computers','bikes']),
  V('mix','mixes','es','iz','p',['the salad','English and Spanish','colors']),
  V('go','goes','es','z','p,a,bus',{p:['to the gym','to bed at 11','to church on Sundays'],a:['outside','to the park'],bus:['downtown','to the airport']}),
  V('do','does','es','does','p',['homework after dinner','yoga','the laundry on Sundays']),
  V('kiss','kisses','es','iz','p',['the baby goodnight','friends on the cheek']),
  V('brush','brushes','es','iz','p',['the dog','the cat every day']),
  V('relax','relaxes','es','iz','p',['on Sundays','after work','at the beach']),
  V('miss','misses','es','iz','p',['home a lot','the bus sometimes','the summer']),
  V('push','pushes','es','iz','p',['the shopping cart','the door','the baby stroller']),
  // y -> ies
  V('study','studies','ies','z','p',['English','at night','in the library']),
  V('carry','carries','ies','z','p',['a big bag','an umbrella','the groceries']),
  V('fly','flies','ies','z','p',['to Brazil every summer','for work']),
  V('reply','replies','ies','z','p',['to emails fast','to messages at night']),
  V('try','tries','ies','z','p',['new food','hard in class']),
  V('cry','cries','ies','z','p',['at sad movies','a lot']),
  V('worry','worries','ies','z','p',['about money','about tests','a lot']),
  // irregular
  V('have','has','irr','has','p,a',{p:['two kids','a big family','lunch at noon'],a:['blue eyes','a big bed']})
];

const TYPES = {
  A:{sym:'+', name:'Affirmative'},
  N:{sym:'–', name:'Negative'},
  Q:{sym:'?', name:'Question'}
};

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const rand = a => a[Math.floor(Math.random()*a.length)];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function comps(v,kind){ return Array.isArray(v.c) ? (kind==='p' || v.k.includes(kind) ? v.c : []) : (v.c[kind]||[]); }
function fits(v,kind){ return v.k.includes(kind) && comps(v,kind).length>0; }

function checked(group){
  return [...document.querySelectorAll(`fieldset[data-group="${group}"] input:checked`)].map(i=>i.value);
}

/* ---------- State ---------- */
const held = {type:false, subj:false, verb:false};
let cur = null;
let spinning = false;
const reelHTML = {};
const wins = {type:$('#win-type'), subj:$('#win-subj'), verb:$('#win-verb'), comp:$('#win-comp')};

/* ---------- Reel items ---------- */
function itemHTML(reel,val){
  if(val==null) return `<div class="item blank">?</div>`;
  if(reel==='type') return `<div class="item type"><span class="sym">${TYPES[val].sym}</span><span class="lbl">${TYPES[val].name}</span></div>`;
  if(reel==='subj') return `<div class="item">${esc(val.t)}</div>`;
  if(reel==='verb') return `<div class="item">${esc(val.b)}</div>`;
  return `<div class="item comp">${esc(val)}</div>`;
}
function fillers(reel,n){
  const out=[];
  for(let i=0;i<n;i++){
    if(reel==='type') out.push(itemHTML('type',rand(['A','N','Q'])));
    else if(reel==='subj') out.push(itemHTML('subj',rand(SUBJECTS)));
    else if(reel==='verb') out.push(itemHTML('verb',rand(VERBS)));
    else { const v=rand(VERBS); out.push(itemHTML('comp',rand(Array.isArray(v.c)?v.c:v.c.p||Object.values(v.c)[0]))); }
  }
  return out;
}
function setReel(reel,html){
  const strip = wins[reel].querySelector('.strip');
  strip.style.transition='none';
  strip.style.transform='none';
  strip.innerHTML = html;
  reelHTML[reel] = html;
}
Object.keys(wins).forEach(r=>setReel(r,itemHTML(r,null)));

/* ---------- Picking a round ---------- */
function pick(){
  const types = checked('types');
  const groups = new Set(checked('groups'));
  const sets = new Set(checked('sets'));
  const subjPool = SUBJECTS.filter(s=>sets.has(s.set));
  const verbPool = VERBS.filter(v=>groups.has(v.g));

  const type = held.type && cur ? cur.type : rand(types);
  let subj, verb;

  for(let tries=0; tries<6; tries++){
    if(held.subj && held.verb && cur){ subj=cur.subj; verb=cur.verb; }
    else if(held.verb && cur){
      verb = cur.verb;
      const c = subjPool.filter(s=>fits(verb,s.k));
      if(!c.length) return {error:`No subject in your settings works with “${verb.b}”. Turn on more subjects or release the verb.`};
      subj = rand(c);
    }
    else if(held.subj && cur){
      subj = cur.subj;
      const c = verbPool.filter(v=>fits(v,subj.k));
      if(!c.length) return {error:`No verb in your groups works with “${subj.t}”. Turn on more verb groups or release the subject.`};
      verb = rand(c);
    }
    else{
      const c = subjPool.filter(s=>verbPool.some(v=>fits(v,s.k)));
      if(!c.length) return {error:'No subjects match the verb groups you chose. Turn on more options in Settings.'};
      subj = rand(c);
      verb = rand(verbPool.filter(v=>fits(v,subj.k)));
    }
    if(!cur || subj!==cur.subj || verb!==cur.verb || (held.subj && held.verb)) break;
  }
  const comp = rand(comps(verb,subj.k));
  return {type,subj,verb,comp};
}

/* ---------- Spinning ---------- */
function animateReel(reel,finalHTML,dur){
  return new Promise(res=>{
    const win = wins[reel];
    const strip = win.querySelector('.strip');
    if(reduceMotion){ setReel(reel,finalHTML); flash(win); return res(); }
    const H = win.clientHeight;
    const n = Math.max(8, Math.round(dur/65));
    strip.style.transition='none';
    strip.style.transform='translateY(0)';
    strip.innerHTML = reelHTML[reel] + fillers(reel,n).join('') + finalHTML;
    void strip.offsetHeight;
    strip.style.transition = `transform ${dur}ms cubic-bezier(.15,.65,.25,1.06)`;
    strip.style.transform = `translateY(${-(n+1)*H}px)`;
    let done=false;
    const finish=()=>{ if(done) return; done=true; setReel(reel,finalHTML); flash(win); res(); };
    strip.addEventListener('transitionend',finish,{once:true});
    setTimeout(finish,dur+120);
  });
}
function flash(win){ win.classList.remove('landed'); void win.offsetWidth; win.classList.add('landed'); }

function spin(){
  if(spinning) return;
  const r = pick();
  if(r.error){ $('#notice').textContent = r.error; return; }
  $('#notice').textContent='';
  spinning = true;
  $('#spin').disabled = true;
  $('#reveal').disabled = true;
  document.querySelectorAll('.hold').forEach(b=>b.disabled=true);
  showHint('Reels spinning…');
  pullLever();

  const order = ['type','subj','verb','comp'];
  const vals = {type:r.type, subj:r.subj, verb:r.verb, comp:r.comp};
  const jobs = order.map((reel,i)=>{
    const html = itemHTML(reel,vals[reel]);
    if(held[reel] && cur) return Promise.resolve();
    return animateReel(reel,html,1000+i*380);
  });
  Promise.all(jobs).then(()=>{
    cur = r;
    spinning = false;
    $('#spin').disabled = false;
    $('#reveal').disabled = false;
    document.querySelectorAll('.hold').forEach(b=>b.disabled=false);
    showHint('Say the sentence out loud, then press Reveal.');
  });
}

function pullLever(){
  const l=$('#lever');
  l.classList.add('pulled');
  setTimeout(()=>l.classList.remove('pulled'),380);
}

/* ---------- Answer ---------- */
function showHint(t){
  const a=$('#answer');
  a.classList.remove('shown');
  a.innerHTML = `<p class="hint">${t}</p>`;
}

function thirdHTML(v){
  if(v.g==='irr') return `<u>${v.s}</u>`;
  const parts = v.b.split(' ');
  const head = parts[0], tail = parts.slice(1).join(' ');
  let h;
  if(v.g==='ies') h = head.slice(0,-1)+'<u>ies</u>';
  else if(v.g==='es') h = head+'<u>es</u>';
  else h = head+'<u>s</u>';
  return tail ? `${h} ${tail}` : h;
}

function spellingReason(v){
  if(v.g==='irr') return `${v.b} → ${v.s} is irregular`;
  if(v.g==='ies') return `${v.b} → ${v.s}: consonant + y, so change y to -ies`;
  if(v.g==='es'){
    const m = v.b.match(/(ch|sh|s|x|z|o)$/);
    return `${v.b} → ${v.s}: ends in -${m?m[1]:'?'}, so add -es`;
  }
  if(v.b.includes(' ')) return `${v.b} → ${v.s}: the -s goes on the verb, not on “up”`;
  if(/[aeiou]y$/.test(v.b)) return `${v.b} → ${v.s}: vowel + y, so just add -s`;
  return `${v.b} → ${v.s}: just add -s`;
}

function pronLine(v){
  if(v.p==='does') return `<b>Sound</b> does = /dʌz/`;
  if(v.p==='has') return `<b>Sound</b> has = /hæz/`;
  if(v.b==='say') return `<b>Sound</b> says = /sɛz/`;
  const map = {s:'/s/', z:'/z/', iz:'/ɪz/'};
  return `<b>Sound</b> the ending in “${v.s.split(' ')[0]}” sounds like ${map[v.p]}`;
}

function subjectLine(s){
  if(s.set==='pro'){
    return s.third
      ? `<b>Subject</b> ${s.t} is he/she/it`
      : `<b>Subject</b> ${s.t} is I/you/we/they`;
  }
  const label = s.k==='p' && s.pro!=='they' ? s.pro : s.pro;
  return s.third
    ? `<b>Subject</b> ${s.t} = ${label}, so use the he/she/it form`
    : `<b>Subject</b> ${s.t} = ${label} (plural), so no -s`;
}

function reveal(){
  if(!cur || spinning) return;
  const {type,subj,verb,comp} = cur;
  const third = subj.third;
  const showPron = $('#opt-pron').checked;
  const showShort = $('#opt-short').checked;
  const S = cap(subj.t);
  let sentence, rules=[subjectLine(subj)], short='';

  if(type==='A'){
    sentence = `${S} <mark>${third ? thirdHTML(verb) : verb.b}</mark> ${comp}.`;
    if(third){
      rules.push(`<b>Spelling</b> ${spellingReason(verb)}`);
      if(showPron) rules.push(pronLine(verb));
    } else {
      rules.push(`<b>Verb</b> base form, no -s`);
    }
  }
  else if(type==='N'){
    const aux = third ? 'doesn’t' : 'don’t';
    sentence = `${S} <mark>${aux} ${verb.b}</mark> ${comp}.`;
    rules.push(`<b>Form</b> ${aux} + base verb (${third?'does':'do'} not)`);
    if(third) rules.push({warn:true, html:`<b>Watch out</b> not “doesn’t ${verb.s}”`});
  }
  else{
    const aux = third ? 'Does' : 'Do';
    const s = subj.t;
    sentence = `<mark>${aux}</mark> ${s} <mark>${verb.b}</mark> ${comp}?`;
    rules.push(`<b>Form</b> ${aux} + ${subj.pro} + base verb`);
    if(third) rules.push({warn:true, html:`<b>Watch out</b> not “Does ${s} ${verb.s}?”`});
    const a = subj.ans, A = cap(a);
    const pos = third ? 'does' : 'do';
    const neg = third ? 'doesn’t' : 'don’t';
    if(showShort) short = `<p class="short">Short answers: <b>Yes, ${a} ${pos}.</b> / <b>No, ${a} ${neg}.</b></p>`;
  }

  const lis = rules.map(r => typeof r==='string' ? `<li>${r}</li>` : `<li class="warn">${r.html}</li>`).join('');
  const el = $('#answer');
  el.innerHTML = `<p class="sentence">${sentence}</p>${short}<ul class="rules">${lis}</ul>`;
  el.classList.remove('shown'); void el.offsetWidth; el.classList.add('shown');
}

/* ---------- Holds ---------- */
function toggleHold(reel){
  const btn = document.querySelector(`.hold[data-reel="${reel}"]`);
  if(!btn || btn.disabled) return;
  held[reel] = !held[reel];
  btn.setAttribute('aria-pressed', held[reel]);
  btn.textContent = held[reel] ? 'Held' : 'Hold';
  wins[reel].classList.toggle('held', held[reel]);
}
document.querySelectorAll('.hold').forEach(b=>b.addEventListener('click',()=>toggleHold(b.dataset.reel)));

/* ---------- Settings guard ---------- */
document.querySelectorAll('fieldset[data-group]').forEach(fs=>{
  if(fs.dataset.group==='extras') return;
  fs.addEventListener('change',e=>{
    if(!fs.querySelector('input:checked')){
      e.target.checked = true;
      $('#notice').textContent = 'Keep at least one option in each group.';
    }
  });
});

/* ---------- Controls ---------- */
$('#spin').addEventListener('click',spin);
$('#lever').addEventListener('click',spin);
$('#reveal').addEventListener('click',reveal);

document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input' || tag==='summary') return;
  if(e.code==='Space'){ e.preventDefault(); spin(); }
  else if(e.key==='r' || e.key==='R'){ reveal(); }
  else if(e.key==='1') toggleHold('type');
  else if(e.key==='2') toggleHold('subj');
  else if(e.key==='3') toggleHold('verb');
});

const fsBtn = $('#fullscreen');
if(!document.fullscreenEnabled){ fsBtn.hidden = true; }
fsBtn.addEventListener('click',()=>{
  try{
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }catch(err){ fsBtn.hidden = true; }
});
document.addEventListener('fullscreenchange',()=>{
  fsBtn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
});
</script>
</body>
</html>
