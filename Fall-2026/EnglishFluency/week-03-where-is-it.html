<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where is it? · Position cards review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F4EC; --surface:#FFFFFF; --ink:#0C2340; --ink-soft:#4A5568; --line:#D9D2BF;
  --gold:#AE9142; --answer:#0E6B6B; --answer-soft:#DCEFEF; --slot:#B9B09A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C2340; --surface:#13305A; --ink:#EFE9D9; --ink-soft:#BFC8D6; --line:#2A4670;
    --gold:#D3B45E; --answer:#6FD0C6; --answer-soft:#123F4A; --slot:#6D7F9C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C2340; --surface:#13305A; --ink:#EFE9D9; --ink-soft:#BFC8D6; --line:#2A4670;
  --gold:#D3B45E; --answer:#6FD0C6; --answer-soft:#123F4A; --slot:#6D7F9C; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Literata",Cambria,Georgia,serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:clamp(16px,3vw,40px)}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:clamp(16px,2.5vw,28px)}
h1{margin:0;font-weight:400;font-size:clamp(28px,4vw,46px);letter-spacing:-0.01em;line-height:1.1}
.count{font-family:Montserrat,Calibri,sans-serif;font-weight:600;font-size:15px;color:var(--ink-soft)}
.count b{color:var(--gold);font-size:22px}
.stage{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(20px,3.5vw,56px);align-items:center}
.card{background:#fff;border:3px dashed var(--gold);border-radius:14px;padding:clamp(8px,1.4vw,18px);margin:0}
.card img{display:block;width:100%;height:auto}
.sentences{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:clamp(18px,2.6vw,34px)}
.sentences li{font-size:clamp(24px,2.9vw,40px);line-height:1.45}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:4.2em;margin:0 .15em;
  padding:0 .3em;border:0;border-bottom:3px solid var(--slot);background:transparent;color:var(--slot);
  font:inherit;cursor:pointer;line-height:1.25;border-radius:6px 6px 0 0;transition:background .2s,color .2s,border-color .2s}
.slot:hover{background:var(--answer-soft)}
.slot:focus-visible,.btn:focus-visible,.dot:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.slot.shown{color:var(--answer);border-bottom-color:var(--answer);font-weight:600;background:var(--answer-soft)}
.slot .q{font-size:.8em}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin:clamp(22px,3vw,36px) 0 0;padding:0;list-style:none}
.bank li{font-family:Montserrat,Calibri,sans-serif;font-weight:500;font-size:clamp(15px,1.5vw,19px);
  padding:8px 16px;border:2px solid var(--line);border-radius:999px;color:var(--ink-soft);transition:border-color .2s,color .2s}
.bank li.used{border-color:var(--answer);color:var(--answer)}
nav{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:clamp(24px,3.5vw,44px);
  padding-top:clamp(16px,2vw,24px);border-top:1px solid var(--line)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--ink-soft);
  font-family:Montserrat,Calibri,sans-serif;font-weight:600;font-size:14px;cursor:pointer}
.dot[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dot.done:not([aria-current="true"]){border-color:var(--answer);color:var(--answer)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-family:Montserrat,Calibri,sans-serif;font-weight:600;font-size:16px;padding:12px 20px;border-radius:10px;
  border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.35;cursor:default}
.hint{font-family:Montserrat,Calibri,sans-serif;font-size:13px;color:var(--ink-soft);margin:14px 0 0}
kbd{font-family:inherit;border:1px solid var(--line);border-radius:4px;padding:1px 6px}
@media (max-width:820px){
  .stage{grid-template-columns:1fr}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const WORDS = ["in","on","next to","between","behind","near","across from"];
let i = 0;
const $ = id => document.getElementById(id);
const list=$("list"), bank=$("bank"), dots=$("dots"), allBtn=$("all");

WORDS.forEach(w => { const li=document.createElement("li"); li.textContent=w; li.dataset.w=w; bank.appendChild(li); });
CARDS.forEach((c,k) => { const b=document.createElement("button"); b.className="dot"; b.textContent=c.n;
  b.setAttribute("aria-label","Card "+c.n); b.onclick=()=>go(k); dots.appendChild(b); });
const seen = new Set();

function slots(){ return [...list.querySelectorAll(".slot")]; }
function refresh(){
  const used = new Set(slots().filter(s=>s.classList.contains("shown")).map(s=>s.dataset.w));
  bank.querySelectorAll("li").forEach(li=>li.classList.toggle("used",used.has(li.dataset.w)));
  const all = slots().every(s=>s.classList.contains("shown"));
  allBtn.textContent = all ? "Hide answers" : "Show answers";
  if(all){ seen.add(i); }
  dots.querySelectorAll(".dot").forEach((d,k)=>{ d.classList.toggle("done",seen.has(k)); d.setAttribute("aria-current",k===i?"true":"false"); });
}
function reveal(s,on){
  s.classList.toggle("shown",on);
  s.innerHTML = on ? s.dataset.w : '<span class="q" aria-hidden="true">?</span>';
  s.setAttribute("aria-label", on ? s.dataset.w : "Show the missing word");
}
function render(){
  const c=CARDS[i];
  $("num").textContent=c.n;
  const pic=$("pic"); pic.src=c.img; pic.alt="Card "+c.n+": a cup, a blue pen, a black pen and a pin on a table";
  list.innerHTML="";
  c.s.forEach(([a,w,b])=>{
    const li=document.createElement("li");
    li.append(a);
    const s=document.createElement("button"); s.className="slot"; s.dataset.w=w;
    s.onclick=()=>{ reveal(s,!s.classList.contains("shown")); refresh(); };
    reveal(s,false); li.append(s); li.append(b); list.appendChild(li);
  });
  $("prev").disabled = i===0;
  $("next").textContent = i===CARDS.length-1 ? "Back to card 1" : "Next card";
  refresh();
}
function go(k){ i=(k+CARDS.length)%CARDS.length; render(); }
$("prev").onclick=()=>go(i-1);
$("next").onclick=()=>go(i+1);
allBtn.onclick=()=>{ const all=slots().every(s=>s.classList.contains("shown")); slots().forEach(s=>reveal(s,!all)); refresh(); };
document.addEventListener("keydown",e=>{
  if(e.target.closest && e.target.closest("button") && (e.key===" "||e.key==="Enter")) return;
  if(e.key==="ArrowRight") go(i+1);
  else if(e.key==="ArrowLeft"&&i>0) go(i-1);
  else if(e.key===" "){ e.preventDefault(); const s=slots().find(s=>!s.classList.contains("shown")); if(s){reveal(s,true);refresh();} }
});
render();
</script>
