<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clock Drill · English Fluency Week 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0C2340; --gold:#AE9142; --gold-b:#D39F10;
  --bg:#F8F4EC; --card:#FFFFFF; --ink:#1A1A1A; --ink-s:#3D3D3D; --muted:#6B6B6B; --line:#E3DCC8;
  --serif: Cambria, "Iowan Old Style", Georgia, serif;
  --sans: "Montserrat", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#081629; --card:#0F2A4A; --ink:#EFE9D9; --ink-s:#D9D2BF; --muted:#A9B4C4; --line:#22406A; color-scheme: dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
.wrap{max-width:900px;margin:0 auto;padding:16px 18px 20px;min-height:100%;display:flex;flex-direction:column;align-items:center}
header{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mono{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;
  font-family:var(--serif);font-style:italic;font-weight:700;color:var(--gold)}
.course{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--gold)}
.sub{font-size:11px;color:var(--muted);letter-spacing:.06em}
.mode{display:flex;border:1.5px solid var(--gold);border-radius:999px;overflow:hidden}
.mode button{background:transparent;color:var(--ink);padding:8px 14px;font-size:13px;font-weight:600}
.mode button[aria-pressed="true"]{background:var(--gold);color:#0C2340}
button{font-family:var(--sans);cursor:pointer;border:none}
button:focus-visible{outline:3px solid var(--gold-b);outline-offset:2px}
.clock{width:min(78vw,58vh,520px);aspect-ratio:1;margin:18px 0 8px}
.clock svg{width:100%;height:100%;display:block}
.question{font-family:var(--serif);font-size:clamp(28px,5vw,46px);color:var(--ink);min-height:1.3em;margin:4px 0 6px;text-align:center}
.question em{color:var(--gold)}
.answer{text-align:center;min-height:120px;visibility:hidden}
.answer.show{visibility:visible}
.digital{font-family:var(--serif);font-size:clamp(44px,9vw,76px);line-height:1;color:var(--ink)}
.words{font-size:clamp(18px,3vw,24px);font-weight:600;color:var(--gold);margin-top:6px}
.a2{font-size:15px;font-style:italic;color:var(--muted);margin-top:4px}
.controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.spin{background:var(--gold);color:#0C2340;font-weight:700;font-size:20px;padding:16px 40px;border-radius:14px;min-width:200px}
.spin:disabled{opacity:.5;cursor:default}
.ghost{background:transparent;border:1.5px solid var(--gold);color:var(--ink);font-weight:600;font-size:16px;padding:14px 22px;border-radius:14px}
.ghost:disabled{opacity:.4;cursor:default}
.hint{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
footer{margin-top:auto;padding-top:18px;font-size:10px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mono">A</div>
      <div><div class="course">ENGLISH FLUENCY · BASIC</div><div class="sub">Week 2 · Clock Drill</div></div>
    </div>
    <div class="mode" role="group" aria-label="Level">
      <button id="easy" aria-pressed="true">:00 :15 :30 :45</button>
      <button id="hard" aria-pressed="false">Every 5 min</button>
    </div>
  </header>

  <div class="clock" id="clock"></div>
  <div class="question" id="question">Press <em>Spin!</em></div>
  <div class="answer" id="answer" aria-live="polite">
    <div class="digital" id="digital"></div>
    <div class="words" id="words"></div>
    <div class="a2" id="a2"></div>
  </div>
  <div class="controls">
    <button class="spin" id="spin">Spin!</button>
    <button class="ghost" id="reveal" disabled>Show answer</button>
    <button class="ghost" id="listen" disabled>🔊 Listen</button>
  </div>
  <div class="hint">Keyboard: Space = spin · Enter = show answer</div>
  <footer>Copyright © 2026 Approach International Student Center, Inc. - Revised on 10/14/2026</footer>
</div>

<script>
const NUM=["twelve","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];
const TENS={20:"twenty",30:"thirty",40:"forty",50:"fifty"};
const TEENS={10:"ten",11:"eleven",12:"twelve",13:"thirteen",14:"fourteen",15:"fifteen",16:"sixteen",17:"seventeen",18:"eighteen",19:"nineteen"};
function minWord(m){
  if(m<10) return "oh "+NUM[m];
  if(m<20) return TEENS[m];
  const t=Math.floor(m/10)*10, u=m%10;
  return TENS[t]+(u?"-"+NUM[u]:"");
}
const hourName=h=>NUM[h%12===0?12:h%12];
function wordsA1(h,m){ return m===0 ? `${hourName(h)} o'clock` : `${hourName(h)} ${minWord(m)}`; }
function wordsA2(h,m){
  const mn=n=>n===1?"one minute":({5:"five",10:"ten",20:"twenty",25:"twenty-five"}[n]||String(n));
  if(m===0) return `${hourName(h)} o'clock`;
  if(m===15) return `quarter past ${hourName(h)}`;
  if(m===30) return `half past ${hourName(h)}`;
  if(m===45) return `quarter to ${hourName(h+1)}`;
  if(m<30) return `${mn(m)} past ${hourName(h)}`;
  return `${mn(60-m)} to ${hourName(h+1)}`;
}

// Build clock face once; hands rotate.
(function build(){
  let ticks="", nums="";
  for(let k=0;k<60;k++){ const big=k%5===0, a=k*6*Math.PI/180, r1=88, r2=big?78:83;
    ticks+=`<line x1="${100+r1*Math.sin(a)}" y1="${100-r1*Math.cos(a)}" x2="${100+r2*Math.sin(a)}" y2="${100-r2*Math.cos(a)}" stroke="${big?'#0C2340':'#9a9a9a'}" stroke-width="${big?3:1}"/>`; }
  for(let n=1;n<=12;n++){ const a=n*30*Math.PI/180;
    nums+=`<text x="${100+66*Math.sin(a)}" y="${100-66*Math.cos(a)+6}" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="700" font-size="17" fill="#0C2340">${n}</text>`; }
  document.getElementById("clock").innerHTML=`<svg viewBox="0 0 200 200" role="img" aria-label="A clock">
    <circle cx="100" cy="100" r="94" fill="#fff" stroke="#0C2340" stroke-width="6"/>${ticks}${nums}
    <line id="hourHand" x1="100" y1="100" x2="100" y2="56" stroke="#0C2340" stroke-width="8" stroke-linecap="round"/>
    <line id="minHand" x1="100" y1="100" x2="100" y2="36" stroke="#AE9142" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="7" fill="#0C2340"/></svg>`;
})();

const $=id=>document.getElementById(id);
let total=12*60;          // current position in minutes (keeps growing so hands always spin forward)
let current=null, spinning=false, easy=true, last=null;

function draw(mins){
  const m=mins%60, h=(mins/60)%12;
  $("minHand").setAttribute("transform",`rotate(${m*6} 100 100)`);
  $("hourHand").setAttribute("transform",`rotate(${h*30} 100 100)`);
}
draw(total);

function pickTime(){
  const steps=easy?[0,15,30,45]:[0,5,10,15,20,25,30,35,40,45,50,55];
  let h,m;
  do{ h=1+Math.floor(Math.random()*12); m=steps[Math.floor(Math.random()*steps.length)]; }
  while(last && last[0]===h && last[1]===m);
  return [h,m];
}

function spin(){
  if(spinning) return;
  spinning=true; current=pickTime(); last=current;
  $("spin").disabled=true; $("reveal").disabled=true; $("listen").disabled=true;
  $("answer").classList.remove("show"); $("question").innerHTML="Spinning…";
  const [h,m]=current;
  const targetInDay=(h%12)*60+m;
  const extra=(6+Math.floor(Math.random()*6))*60;          // 6–11 extra hours of spin
  let end=total-(total%720)+targetInDay; while(end<=total+extra) end+=720;
  const start=total, dist=end-start;
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dur=reduce?1:2600, t0=performance.now();
  const ease=t=>1-Math.pow(1-t,4);
  function frame(now){
    const t=Math.min(1,(now-t0)/dur);
    total=start+dist*ease(t); draw(total);
    if(t<1) requestAnimationFrame(frame);
    else{ total=end; draw(total); done(); }
  }
  requestAnimationFrame(frame);
}
function done(){
  spinning=false;
  const [h,m]=current;
  $("question").innerHTML="What time <em>is it?</em>";
  $("digital").textContent=`${h}:${String(m).padStart(2,"0")}`;
  $("words").textContent=`It's ${wordsA1(h,m)}.`;
  const a2=wordsA2(h,m);
  $("a2").textContent = a2!==wordsA1(h,m) ? `A2: It's ${a2}.` : "";
  $("spin").disabled=false; $("reveal").disabled=false; $("listen").disabled=false;
  $("reveal").focus();
}
function reveal(){ if(current && !spinning) $("answer").classList.add("show"); }
function listen(){
  if(!current || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(`It's ${wordsA1(...current)}.`); u.lang="en-US"; u.rate=0.85;
  speechSynthesis.speak(u);
}
function setMode(e){ easy=e; $("easy").setAttribute("aria-pressed",e); $("hard").setAttribute("aria-pressed",!e); }

$("spin").onclick=spin; $("reveal").onclick=reveal; $("listen").onclick=listen;
$("easy").onclick=()=>setMode(true); $("hard").onclick=()=>setMode(false);
document.addEventListener("keydown",e=>{
  if(e.code==="Space"){ e.preventDefault(); spin(); }
  else if(e.key==="Enter" && !e.target.closest("button")){ reveal(); }
});
</script>
</body>
</html>
