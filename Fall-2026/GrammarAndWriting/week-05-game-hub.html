<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Week 5 Game Hub · Cleft Sentences</title>
<style>
:root{
  --navy:#0C2340; --gold:#AE9142; --gold-b:#D39F10; --warm:#EFE9D9; --teal:#0E6B6B; --amber:#B45309; --red:#C0392B; --green:#26890C;
  --bg:#FFFFFF; --surface:#EDF2F9; --ink:#1A1A1A; --ink-s:#3D3D3D; --muted:#6B6B6B; --line:#D5DAE2; --accent:var(--teal); --title:#0C2340;
  --ok-bg:#D4EDDA; --bad-bg:#F8D7DA; --glow:rgba(211,159,16,.30);
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C2340; --surface:#143865; --ink:#EFE9D9; --ink-s:#D9D2C1; --muted:#A9B4C6; --line:#2A4A78; --accent:#5FB3B3; --title:#EFE9D9;
    --ok-bg:#1E4A2A; --bad-bg:#5A2026; --glow:rgba(211,159,16,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C2340; --surface:#143865; --ink:#EFE9D9; --ink-s:#D9D2C1; --muted:#A9B4C6; --line:#2A4A78; --accent:#5FB3B3; --title:#EFE9D9;
  --ok-bg:#1E4A2A; --bad-bg:#5A2026; --glow:rgba(211,159,16,.35); color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:Cambria, "Hoefler Text", Georgia, "Times New Roman", serif; -webkit-font-smoothing:antialiased}
.sans{font-family:Calibri, "Segoe UI", "Helvetica Neue", Arial, sans-serif}
header{display:flex; align-items:center; gap:1.2rem; flex-wrap:wrap; padding:1rem clamp(1rem,3vw,2.5rem); border-bottom:1px solid var(--line)}
.mono{width:2.1rem;height:2.1rem;border:1.5px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-style:italic;font-weight:700;font-size:1.15rem;flex:none}
.brand{line-height:1.15}
.brand b{display:block;font-size:.78rem;letter-spacing:.18em;color:var(--gold)}
.brand span{font-size:.8rem;color:var(--muted)}
nav{display:flex; gap:.35rem; margin-left:auto; flex-wrap:wrap}
nav button{font:inherit; font-family:Calibri,"Segoe UI",Arial,sans-serif; font-size:1rem; padding:.5rem .9rem; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:6px; cursor:pointer}
nav button[aria-selected="true"]{background:var(--title); color:var(--bg); border-color:var(--title)}
nav button kbd{font-family:Consolas,monospace;font-size:.75rem;opacity:.6;margin-right:.35rem}
.iconbtn{font:inherit;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:.45rem .7rem;cursor:pointer;font-size:1rem}
button:focus-visible{outline:3px solid var(--gold-b); outline-offset:2px}
main{padding:clamp(1rem,3vw,2.5rem); max-width:1400px; margin:0 auto}
.meta{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem}
.meta h1{margin:0;font-weight:400;font-size:clamp(1.8rem,3.4vw,3rem);color:var(--title)}
.meta h1 em{color:var(--gold)}
.count{font-family:Consolas,monospace;color:var(--muted);font-size:1.05rem}
.tag{display:inline-block;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-size:.85rem;font-weight:700;letter-spacing:.12em;padding:.2rem .55rem;border:1px solid currentColor;border-radius:4px;color:var(--accent)}
.stage{min-height:46vh; display:flex; flex-direction:column; justify-content:center; gap:1.4rem; padding:clamp(1rem,3vw,2.5rem) 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.prompt{font-size:clamp(1.7rem,3.6vw,3.2rem); line-height:1.3; margin:0; color:var(--ink)}
.focus{color:var(--ink); background:radial-gradient(ellipse at 50% 55%, var(--glow) 0%, transparent 72%); padding:0 .2em; border-bottom:3px solid var(--gold-b); font-weight:700}
.answer{font-size:clamp(1.4rem,2.9vw,2.5rem); line-height:1.3; margin:0; color:var(--accent); font-style:italic; opacity:0; transform:translateY(.4rem); transition:opacity .35s ease, transform .35s ease}
.answer.show{opacity:1; transform:none}
.why{font-size:clamp(1rem,1.6vw,1.35rem); color:var(--ink-s); margin:0; opacity:0; transition:opacity .35s ease}
.why.show{opacity:1}
.wrong{color:var(--red)}
.wrong.struck{text-decoration:line-through; text-decoration-thickness:2px; text-decoration-color:rgba(192,57,43,.5)}
.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(16rem,1fr)); gap:1rem}
.opt{border:2px solid var(--line); border-radius:8px; padding:1rem 1.2rem; font-size:clamp(1.2rem,2.2vw,1.9rem); display:flex; gap:.8rem; align-items:baseline; transition:background .3s, border-color .3s}
.opt b{font-family:Calibri,"Segoe UI",Arial,sans-serif; color:var(--gold); font-size:1.1em}
.opt.right{border-color:var(--green); background:var(--ok-bg)}
.opt.dim{opacity:.45}
.controls{display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; margin-top:1.2rem}
.btn{font-family:Calibri,"Segoe UI",Arial,sans-serif; font-size:1.1rem; padding:.7rem 1.3rem; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer}
.btn.primary{background:var(--gold); border-color:var(--gold); color:#0C2340; font-weight:700}
.timer{margin-left:auto; font-family:Consolas,monospace; font-size:1.6rem; color:var(--muted); min-width:4.5ch; text-align:right}
.timer.low{color:var(--red)}
.board{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:.6rem; margin-top:1.6rem}
.team{border:1px solid var(--line); border-radius:8px; padding:.6rem .8rem; display:flex; align-items:center; justify-content:space-between; gap:.4rem}
.team .nm{font-family:Calibri,"Segoe UI",Arial,sans-serif; color:var(--muted); font-size:.95rem}
.team .sc{font-size:2rem; color:var(--title); min-width:2ch; text-align:center}
.team button{font:inherit; width:2rem; height:2rem; border-radius:50%; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; font-size:1.1rem; line-height:1}
.hint{color:var(--muted); font-size:.95rem; margin-top:1rem}
.hidden{display:none}
@media (max-width:720px){ .board{grid-template-columns:repeat(2,minmax(0,1fr))} nav{margin-left:0} }
@media (prefers-reduced-motion: reduce){ .answer,.why,.opt{transition:none} }
</style>
</head>
<body>
<header>
  <div class="mono" aria-hidden="true">A</div>
  <div class="brand sans"><b>APPLIED GRAMMAR · PROFICIENT</b><span>Week 5 · Game Hub · Cleft sentences</span></div>
  <nav role="tablist" aria-label="Game modes">
    <button role="tab" data-mode="rewind"><kbd>1</kbd>Rewind</button>
    <button role="tab" data-mode="spot"><kbd>2</kbd>Spotlight</button>
    <button role="tab" data-mode="fix"><kbd>3</kbd>Fix It</button>
    <button role="tab" data-mode="speed"><kbd>4</kbd>Speed Review</button>
  </nav>
  <button class="iconbtn sans" id="theme" aria-label="Switch light or dark">◐</button>
</header>
<main>
  <div class="meta"><h1 id="title"></h1><span class="count" id="count"></span><span class="tag" id="tag"></span></div>
  <section class="stage" id="stage" aria-live="polite"></section>
  <div class="controls">
    <button class="btn" id="prev">← Back</button>
    <button class="btn primary" id="reveal">Reveal</button>
    <button class="btn" id="next">Next →</button>
    <button class="btn" id="tbtn">Timer</button>
    <span class="timer" id="timer"></span>
  </div>
  <div class="board" id="board"></div>
  <p class="hint sans">Keys: 1–4 change mode · Space reveals · ← → move · T starts the timer · Team scores stay the same in every mode.</p>
</main>
<script>
const DATA = {"rewind":[{"wk":"WEEK 2","q":"The bridge ___ (repair) right now, so the road is closed.","a":"is being repaired","why":"Present continuous passive: in progress now."},{"wk":"WEEK 2","q":"By 2030, the new hospital ___ (build).","a":"will have been built","why":"Future perfect passive: finished before a future time."},{"wk":"WEEK 2","q":"Nobody checked the brakes. That was a big mistake! → The brakes ___ (check).","a":"should have been checked","why":"Modal perfect passive: criticism of the past."},{"wk":"WEEK 2","q":"People say that the mayor is planning a new park. → The mayor is said ___ a new park.","a":"to be planning","why":"Reporting verb + continuous infinitive (in progress now)."},{"wk":"WEEK 2","q":"Experts estimate that 30,000 people attended the concert. → It ___ that 30,000 people attended.","a":"is estimated","why":"Reporting verb, Frame 1: It is + past participle + that…"},{"wk":"WEEK 2","q":"A mechanic repaired my car for me. → I had my car ___.","a":"repaired","why":"Causative have + object + past participle: someone did it for me."}],"spot":[{"s":"[The intern] discovered the problem.","a":"It was the intern who discovered the problem."},{"s":"The report was rejected [because of the missing data].","a":"It was because of the missing data that the report was rejected."},{"s":"We moved to Florida [in 2019].","a":"It was in 2019 that we moved to Florida."},{"s":"[The new manager] has changed the schedule.","a":"It is the new manager who has changed the schedule."},{"s":"[Her advice] helped me the most.","a":"It was her advice that helped me the most."},{"s":"The documents were signed [at the bank], not at the office.","a":"It was at the bank that the documents were signed."},{"s":"[The heater] is being repaired right now, not the AC.","a":"It is the heater that is being repaired right now."},{"s":"I met my best friend [in an English class].","a":"It was in an English class that I met my best friend."},{"s":"[Lack of sleep] makes students tired, not the homework.","a":"It is lack of sleep that makes students tired."},{"s":"[The landlord] should have fixed the heater.","a":"It was the landlord who should have fixed the heater."}],"fix":[{"s":"It was my manager which approved the request.","a":"It was my manager who approved the request.","why":"Person → who (or that), never which.","tag":"CLEFT"},{"s":"What the report shows that sales are falling.","a":"What the report shows is that sales are falling.","why":"Wh-cleft needs is/was.","tag":"CLEFT"},{"s":"It is the implementation of the plan who caused the delay.","a":"It is the implementation of the plan that caused the delay.","why":"Thing → that, never who.","tag":"CLEFT"},{"s":"What the team did was to redesigned the website.","a":"What the team did was redesign the website.","why":"What…did was + base verb (or to + base verb).","tag":"CLEFT"},{"s":"It were the students who organized the event.","a":"It was the students who organized the event.","why":"Always it is / it was (singular), even for plural focus.","tag":"CLEFT"},{"s":"What I need are more time.","a":"What I need is more time.","why":"Wh-clause = singular subject → is.","tag":"CLEFT"},{"s":"It was in 2020 when I started my business.","a":"It was in 2020 that I started my business.","why":"In formal writing, it-clefts use that (not when / where).","tag":"CLEFT"},{"s":"If I would have known, I would have called you.","a":"If I had known, I would have called you.","why":"Third conditional: if + past perfect.","tag":"WEEK 3"},{"s":"The new rules are expected to announced next week.","a":"The new rules are expected to be announced next week.","why":"Passive infinitive: to be + past participle.","tag":"WEEK 2"},{"s":"She is knowing the answer, but she won’t say it.","a":"She knows the answer, but she won’t say it.","why":"State verb (know): not continuous.","tag":"WEEK 1"}],"speed":[{"q":"Which is correct?","o":["It was Maria which called.","It was Maria who called.","It was Maria what called."],"a":1,"tag":"CLEFT"},{"q":"What the study shows ___ the importance of sleep.","o":["are","is","that"],"a":1,"tag":"CLEFT"},{"q":"The noun form of refuse is…","o":["refusement","refusing","refusal"],"a":2,"tag":"NOUN"},{"q":"What the team did was ___ the process.","o":["redesigned","redesign","redesigning"],"a":1,"tag":"CLEFT"},{"q":"Which sentence puts the TIME in the spotlight?","o":["It was in May that the store opened.","It was the store that opened in May.","What opened in May was the store."],"a":0,"tag":"CLEFT"},{"q":"If I ___ more time yesterday, I would have finished.","o":["would have","had had","have had"],"a":1,"tag":"WEEK 3"},{"q":"The winner ___ next week.","o":["will announce","will announced","will be announced"],"a":2,"tag":"WEEK 2"},{"q":"She ___ at the clinic since 2020.","o":["works","has worked","is working"],"a":1,"tag":"WEEK 1"},{"q":"The noun form of efficient is…","o":["efficiency","efficientness","efficience"],"a":0,"tag":"NOUN"},{"q":"Best wh-cleft for “The price surprised me.”","o":["What the price surprised me was.","It surprised me was the price.","What surprised me was the price."],"a":2,"tag":"CLEFT"},{"q":"The fire is thought ___ in the kitchen.","o":["to have started","to start","to has started"],"a":0,"tag":"WEEK 2"},{"q":"You can join the team ___ you arrive on time.","o":["unless","as long as","even if"],"a":1,"tag":"WEEK 3"}]};
const MODES = {
  rewind: { title: "Grammar <em>Rewind</em>", items: DATA.rewind, secs: 40 },
  spot:   { title: "Spotlight <em>race</em>", items: DATA.spot, secs: 80 },
  fix:    { title: "The Fix It <em>Clinic</em>", items: DATA.fix, secs: 60 },
  speed:  { title: "Speed <em>Review</em>", items: DATA.speed, secs: 30 },
};
const state = { mode: "rewind", idx: { rewind:0, spot:0, fix:0, speed:0 }, shown: false, scores: [0,0,0,0,0], t: null, left: 0 };
try { const s = JSON.parse(localStorage.getItem("w5hub") || "null"); if (s && Array.isArray(s.scores)) state.scores = s.scores; } catch(e) {}
function persist(){ try { localStorage.setItem("w5hub", JSON.stringify({ scores: state.scores })); } catch(e) {} }
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
const focusify = (s) => esc(s).replace(/\[([^\]]+)\]/g, '<span class="focus">$1</span>');
function render(){
  const m = MODES[state.mode], i = state.idx[state.mode], it = m.items[i];
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.mode === state.mode));
  $("title").innerHTML = m.title; $("count").textContent = (i+1) + " / " + m.items.length;
  let tag = "", h = "";
  if (state.mode === "rewind") { tag = it.wk.replace("WEEK","Week");
    h = '<p class="prompt">' + esc(it.q) + '</p><p class="answer">' + esc(it.a) + '</p><p class="why">' + esc(it.why) + '</p>'; }
  if (state.mode === "spot") { tag = "it-cleft";
    h = '<p class="prompt">' + focusify(it.s) + '</p><p class="answer">' + esc(it.a) + '</p>'; }
  if (state.mode === "fix") { tag = it.tag === "CLEFT" ? "Cleft" : it.tag.replace("WEEK","Week");
    h = '<p class="prompt"><span class="wrong">' + esc(it.s) + '</span></p><p class="answer">' + esc(it.a) + '</p><p class="why">' + esc(it.why) + '</p>'; }
  if (state.mode === "speed") { tag = it.tag === "CLEFT" ? "Cleft" : it.tag === "NOUN" ? "Nouns" : it.tag.replace("WEEK","Week");
    h = '<p class="prompt">' + esc(it.q) + '</p><div class="opts">' + it.o.map((o,k) => '<div class="opt" data-k="'+k+'"><b>' + "ABC"[k] + '</b><span>' + esc(o) + '</span></div>').join("") + '</div>'; }
  $("tag").textContent = tag; $("tag").classList.toggle("hidden", state.mode === "fix"); $("stage").innerHTML = h; state.shown = false; $("reveal").textContent = "Reveal";
  stopTimer(); $("timer").textContent = "";
}
function reveal(){
  state.shown = !state.shown;
  const m = MODES[state.mode], it = m.items[state.idx[state.mode]];
  document.querySelectorAll(".answer,.why").forEach(e => e.classList.toggle("show", state.shown));
  document.querySelectorAll(".wrong").forEach(e => e.classList.toggle("struck", state.shown));
  if (state.mode === "speed") document.querySelectorAll(".opt").forEach(e => { const ok = +e.dataset.k === it.a; e.classList.toggle("right", state.shown && ok); e.classList.toggle("dim", state.shown && !ok); });
  if (state.mode === "fix") $("tag").classList.toggle("hidden", !state.shown);
  $("reveal").textContent = state.shown ? "Hide" : "Reveal";
  if (state.shown) stopTimer();
}
function move(d){ const m = MODES[state.mode]; state.idx[state.mode] = Math.max(0, Math.min(m.items.length - 1, state.idx[state.mode] + d)); render(); }
function setMode(k){ state.mode = k; render(); }
function stopTimer(){ if (state.t) { clearInterval(state.t); state.t = null; } $("timer").classList.remove("low"); }
function startTimer(){ stopTimer(); state.left = MODES[state.mode].secs; tick(); state.t = setInterval(() => { state.left--; tick(); if (state.left <= 0) stopTimer(); }, 1000); }
function tick(){ const s = Math.max(0, state.left); $("timer").textContent = Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); $("timer").classList.toggle("low", s <= 10); }
function board(){
  $("board").innerHTML = state.scores.map((s,i) => '<div class="team"><button aria-label="Team '+(i+1)+' minus one" data-t="'+i+'" data-d="-1">−</button><div style="text-align:center"><div class="nm">Team '+(i+1)+'</div><div class="sc">'+s+'</div></div><button aria-label="Team '+(i+1)+' plus one" data-t="'+i+'" data-d="1">+</button></div>').join("") +
    '';
}
$("board").addEventListener("click", e => { const b = e.target.closest("button[data-t]"); if (!b) return; const t = +b.dataset.t; state.scores[t] = Math.max(0, state.scores[t] + (+b.dataset.d)); persist(); board(); });
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
$("prev").onclick = () => move(-1); $("next").onclick = () => move(1); $("reveal").onclick = reveal; $("tbtn").onclick = startTimer;
$("theme").onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; };
document.addEventListener("keydown", e => {
  const map = { "1":"rewind", "2":"spot", "3":"fix", "4":"speed" };
  if (map[e.key]) setMode(map[e.key]);
  else if (e.key === " ") { e.preventDefault(); reveal(); }
  else if (e.key === "ArrowRight") move(1);
  else if (e.key === "ArrowLeft") move(-1);
  else if (e.key === "t" || e.key === "T") startTimer();
});
const reset = document.createElement("button"); reset.className = "btn"; reset.textContent = "Reset scores";
reset.onclick = () => { if (confirm("Reset all team scores to 0?")) { state.scores = [0,0,0,0,0]; persist(); board(); } };
document.querySelector(".controls").insertBefore(reset, $("timer"));
board(); render();
</script>
</body>
</html>
